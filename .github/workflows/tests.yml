name: Python regression tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    name: Python 3.11 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run isolated regressions
        run: python -B -m pytest tests -q -o addopts='' -p no:cacheprovider
      - name: Verify synthetic replay example
        run: python -B -m btc_v3.cli replay-jsonl --input examples/synthetic-btc-window.jsonl --strategy-profile-json examples/book-imbalance.strategy.json --output replay-demo-report.json
